name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Weekly full regression on Sundays at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "Test scope: fast or full"
        required: false
        default: "full"
        type: choice
        options:
          - fast
          - full

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Determine which test lanes to run
  # ---------------------------------------------------------------------------
  determine-scope:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      changed_datasets: ${{ steps.scope.outputs.changed_datasets }}
      changed_tasks: ${{ steps.scope.outputs.changed_tasks }}
      changed_models: ${{ steps.scope.outputs.changed_models }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine test scope
        id: scope
        run: |
          # Manual dispatch overrides (only fast or full — no affected, since there's no PR diff context).
          # Lanes skip naturally when the changed_* outputs are all empty, so we don't conflate
          # "manual fast scope override" with "actual docs-only diff" by flipping docs_only.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SCOPE="${{ github.event.inputs.scope }}"
            if [[ "$SCOPE" == "fast" ]]; then
              echo "run_full=false" >> "$GITHUB_OUTPUT"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "changed_datasets=[]" >> "$GITHUB_OUTPUT"
              echo "changed_tasks=[]" >> "$GITHUB_OUTPUT"
              echo "changed_models=[]" >> "$GITHUB_OUTPUT"
              echo "reason=manual dispatch: fast only" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "run_full=true" >> "$GITHUB_OUTPUT"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "changed_datasets=[]" >> "$GITHUB_OUTPUT"
              echo "changed_tasks=[]" >> "$GITHUB_OUTPUT"
              echo "changed_models=[]" >> "$GITHUB_OUTPUT"
              echo "reason=manual dispatch: full" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Push to main or schedule → always full
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "changed_datasets=[]" >> "$GITHUB_OUTPUT"
            echo "changed_tasks=[]" >> "$GITHUB_OUTPUT"
            echo "changed_models=[]" >> "$GITHUB_OUTPUT"
            echo "reason=push to main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "changed_datasets=[]" >> "$GITHUB_OUTPUT"
            echo "changed_tasks=[]" >> "$GITHUB_OUTPUT"
            echo "changed_models=[]" >> "$GITHUB_OUTPUT"
            echo "reason=scheduled regression" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check for full-ci label on PRs
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" == "true" ]]; then
              echo "run_full=true" >> "$GITHUB_OUTPUT"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "changed_datasets=[]" >> "$GITHUB_OUTPUT"
              echo "changed_tasks=[]" >> "$GITHUB_OUTPUT"
              echo "changed_models=[]" >> "$GITHUB_OUTPUT"
              echo "reason=full-ci label present" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # PR: detect affected components
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.sha }}"

          if [[ -z "$BASE_REF" ]]; then
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.sha }}"
          fi

          python .github/scripts/select_test_scope.py "$BASE_REF" "$HEAD_REF"

      - name: Print scope summary
        run: |
          echo "### Test Scope" >> "$GITHUB_STEP_SUMMARY"
          echo "- **run_full**: ${{ steps.scope.outputs.run_full }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **docs_only**: ${{ steps.scope.outputs.docs_only }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **datasets**: ${{ steps.scope.outputs.changed_datasets }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **tasks**: ${{ steps.scope.outputs.changed_tasks }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **models**: ${{ steps.scope.outputs.changed_models }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **reason**: ${{ steps.scope.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 2: Fast checks — always run
  # ---------------------------------------------------------------------------
  fast-checks:
    runs-on: ubuntu-latest
    needs: [determine-scope]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: "3.11"

      - name: Doctests and unit tests
        run: uv run pytest --doctest-modules -m "not integration" -x

  # ---------------------------------------------------------------------------
  # Job 3: Dataset lane — run for changed datasets (when not doing full)
  # ---------------------------------------------------------------------------
  dataset-lane:
    runs-on: ubuntu-latest
    needs: [determine-scope, fast-checks]
    if: >-
      needs.determine-scope.outputs.run_full != 'true' &&
      needs.determine-scope.outputs.docs_only != 'true' &&
      needs.determine-scope.outputs.changed_datasets != '[]'
    timeout-minutes: 120
    env:
      # Same layout as full-integration: built datasets are reused within the run, raw downloads across runs.
      MEDS_DEV_CACHE_DIR: /tmp/meds_dev_cache
      MEDS_DEV_DOWNLOAD_DIR: /tmp/meds_dev_downloads
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJson(needs.determine-scope.outputs.changed_datasets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: "3.11"

      - name: Cache raw demo downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.MEDS_DEV_DOWNLOAD_DIR }}/*/raw
          key: demo-downloads-v1-${{ runner.os }}-${{ hashFiles('src/MEDS_DEV/datasets/**/requirements.txt') }}
          restore-keys: demo-downloads-v1-${{ runner.os }}-

      - name: Run dataset integration tests for ${{ matrix.dataset }}
        env:
          DATASET: ${{ matrix.dataset }}
        run: |
          mkdir -p "$MEDS_DEV_CACHE_DIR"
          uv run pytest -v -s -x -m integration --test_dataset="$DATASET" \
            --persistent_cache_dir="$MEDS_DEV_CACHE_DIR" --cache_dataset=all --reuse_cached_dataset=all \
            --download_cache_dir="$MEDS_DEV_DOWNLOAD_DIR"

  # ---------------------------------------------------------------------------
  # Job 4: Task lane — run for changed tasks (when not doing full)
  # ---------------------------------------------------------------------------
  task-lane:
    runs-on: ubuntu-latest
    needs: [determine-scope, fast-checks]
    if: >-
      needs.determine-scope.outputs.run_full != 'true' &&
      needs.determine-scope.outputs.docs_only != 'true' &&
      needs.determine-scope.outputs.changed_tasks != '[]'
    timeout-minutes: 120
    env:
      # Same layout as full-integration: built datasets are reused within the run, raw downloads across runs.
      MEDS_DEV_CACHE_DIR: /tmp/meds_dev_cache
      MEDS_DEV_DOWNLOAD_DIR: /tmp/meds_dev_downloads
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.determine-scope.outputs.changed_tasks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: "3.11"

      - name: Cache raw demo downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.MEDS_DEV_DOWNLOAD_DIR }}/*/raw
          key: demo-downloads-v1-${{ runner.os }}-${{ hashFiles('src/MEDS_DEV/datasets/**/requirements.txt') }}
          restore-keys: demo-downloads-v1-${{ runner.os }}-

      - name: Run task integration tests for ${{ matrix.task }}
        env:
          TASK: ${{ matrix.task }}
        run: |
          mkdir -p "$MEDS_DEV_CACHE_DIR"
          uv run pytest -v -s -x -m integration --test_task="$TASK" \
            --persistent_cache_dir="$MEDS_DEV_CACHE_DIR" --cache_dataset=all --reuse_cached_dataset=all \
            --download_cache_dir="$MEDS_DEV_DOWNLOAD_DIR"

  # ---------------------------------------------------------------------------
  # Job 5: Model lane — run for changed models (when not doing full)
  # ---------------------------------------------------------------------------
  model-lane:
    runs-on: ubuntu-latest
    needs: [determine-scope, fast-checks]
    if: >-
      needs.determine-scope.outputs.run_full != 'true' &&
      needs.determine-scope.outputs.docs_only != 'true' &&
      needs.determine-scope.outputs.changed_models != '[]'
    timeout-minutes: 120
    env:
      # Same layout as full-integration: built datasets are reused within the run, raw downloads across runs.
      MEDS_DEV_CACHE_DIR: /tmp/meds_dev_cache
      MEDS_DEV_DOWNLOAD_DIR: /tmp/meds_dev_downloads
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.determine-scope.outputs.changed_models) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: "3.11"

      - name: Cache raw demo downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.MEDS_DEV_DOWNLOAD_DIR }}/*/raw
          key: demo-downloads-v1-${{ runner.os }}-${{ hashFiles('src/MEDS_DEV/datasets/**/requirements.txt') }}
          restore-keys: demo-downloads-v1-${{ runner.os }}-

      - name: Run model integration tests for ${{ matrix.model }}
        env:
          MODEL: ${{ matrix.model }}
        run: |
          mkdir -p "$MEDS_DEV_CACHE_DIR"
          uv run pytest -v -s -x -m integration --test_model="$MODEL" \
            --persistent_cache_dir="$MEDS_DEV_CACHE_DIR" --cache_dataset=all --reuse_cached_dataset=all \
            --download_cache_dir="$MEDS_DEV_DOWNLOAD_DIR"

  # ---------------------------------------------------------------------------
  # Job 6: Full-integration setup — list the matrix and fetch the raw demo data once for it
  # ---------------------------------------------------------------------------
  full-integration-setup:
    runs-on: ubuntu-latest
    needs: [determine-scope, fast-checks]
    if: needs.determine-scope.outputs.run_full == 'true'
    timeout-minutes: 90
    outputs:
      combos: ${{ steps.combos.outputs.combos }}
    env:
      MEDS_DEV_CACHE_DIR: /tmp/meds_dev_cache
      # Raw PhysioNet downloads, the only thing cached across runs.
      MEDS_DEV_DOWNLOAD_DIR: /tmp/meds_dev_downloads
    steps:
      - uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: "3.11"

      # One matrix entry per model × dataset × task that the suite would test, read from pytest's own
      # collection, so new datasets, tasks, and models (and the tasks' `supported_datasets`) are picked up
      # automatically.
      - name: List model × dataset × task combinations
        id: combos
        run: |
          uv run pytest --collect-only -q -m integration > collected.txt
          uv run python - >> "$GITHUB_OUTPUT" <<'EOF'
          import itertools, json
          from MEDS_DEV import DATASETS, MODELS, TASKS
          collected = set(open("collected.txt").read().split())
          combos = [
              {"model": m, "dataset": d, "task": t}
              for m, d, t in itertools.product(sorted(MODELS), sorted(DATASETS), sorted(TASKS))
              if f"tests/test_2_supervised_models.py::test_supervised[{t}-{d}-{m}]" in collected
          ]
          print(f"combos={json.dumps(combos)}")
          EOF

      # Only the raw demo downloads (open-access MIMIC-IV / eICU-CRD demo files) are cached across runs; the
      # ETL always runs on them, so every run still tests the transformation. The ETLs skip files that are
      # already present with a valid PhysioNet checksum, so a changed upstream file is re-downloaded. The
      # key follows the ETL pins; restore-keys reuses an older entry so only new files are fetched.
      # Caches saved from PRs are scoped to that PR, so they can never be restored on `main`.
      - name: Check for cached raw demo downloads
        id: download-cache-lookup
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MEDS_DEV_DOWNLOAD_DIR }}/*/raw
          key: demo-downloads-v1-${{ runner.os }}-${{ hashFiles('src/MEDS_DEV/datasets/**/requirements.txt') }}
          lookup-only: true

      # Everything below runs only on a cache miss, so the matrix jobs don't each download from PhysioNet.
      - name: Restore older raw demo downloads
        id: download-cache
        if: steps.download-cache-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MEDS_DEV_DOWNLOAD_DIR }}/*/raw
          key: ${{ steps.download-cache-lookup.outputs.cache-primary-key }}
          restore-keys: demo-downloads-v1-${{ runner.os }}-

      # PhysioNet is flaky (502s, dropped connections) and the ETLs don't retry, so build the demo datasets
      # (which downloads them) with one retry. Built datasets go to `<cache>/<name>/` plus a
      # `<cache>/.<name>.check` marker (see tests/conftest.py). A failed build's partial output (and its
      # venv) is removed first, because `run_in_env` refuses to reuse a directory whose `cmd.sh` differs.
      - name: Build demo datasets
        id: demo-build
        if: steps.download-cache-lookup.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$MEDS_DEV_CACHE_DIR"
          for attempt in 1 2; do
            for dir in "$MEDS_DEV_CACHE_DIR"/*/; do
              name=$(basename "$dir")
              if [[ "$name" != "venvs" && ! -f "$MEDS_DEV_CACHE_DIR/.$name.check" ]]; then
                echo "Removing partial build of $name"
                rm -rf "$dir" "$MEDS_DEV_CACHE_DIR/venvs/datasets/$name"
              fi
            done
            uv run pytest -v -s -x tests/test_0_datasets.py -k test_datasets_configured \
              --persistent_cache_dir="$MEDS_DEV_CACHE_DIR" --cache_dataset=all --reuse_cached_dataset=all \
              --download_cache_dir="$MEDS_DEV_DOWNLOAD_DIR" \
              && exit 0
            echo "::warning::Demo dataset build attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

      # Saved only after a successful build, so every demo dataset's downloads are complete. Only `*/raw` is
      # saved, never ETL output.
      - name: Save raw demo downloads
        if: steps.demo-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MEDS_DEV_DOWNLOAD_DIR }}/*/raw
          key: ${{ steps.download-cache-lookup.outputs.cache-primary-key }}

  # ---------------------------------------------------------------------------
  # Job 7: Full integration — push to main, schedule, label, or core changes; one job per
  # model × dataset × task
  # ---------------------------------------------------------------------------
  full-integration:
    runs-on: ubuntu-latest
    needs: [determine-scope, full-integration-setup]
    if: needs.determine-scope.outputs.run_full == 'true'
    timeout-minutes: 120
    env:
      # Built datasets, reused within this job only (never saved to the Actions cache).
      MEDS_DEV_CACHE_DIR: /tmp/meds_dev_cache
      MEDS_DEV_DOWNLOAD_DIR: /tmp/meds_dev_downloads
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.full-integration-setup.outputs.combos) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: "3.11"

      - name: Restore raw demo downloads
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MEDS_DEV_DOWNLOAD_DIR }}/*/raw
          key: demo-downloads-v1-${{ runner.os }}-${{ hashFiles('src/MEDS_DEV/datasets/**/requirements.txt') }}
          restore-keys: demo-downloads-v1-${{ runner.os }}-

      # Each job builds its demo dataset from the restored downloads (fetching any file still missing) and runs
      # that dataset's and task's tests and the non-integration tests alongside the model's tests, so every
      # job is a complete suite for its combination.
      # --reuse_cached_dataset reuses this job's builds, so the session-scoped `demo_dataset` fixture does not
      # rebuild a dataset each time the test order switches between datasets.
      - name: Run full test suite for ${{ matrix.model }} on ${{ matrix.dataset }} / ${{ matrix.task }}
        env:
          MODEL: ${{ matrix.model }}
          DATASET: ${{ matrix.dataset }}
          TASK: ${{ matrix.task }}
        run: |
          mkdir -p "$MEDS_DEV_CACHE_DIR"
          uv run pytest -v --doctest-modules --cov=src --cov-report=xml --junitxml=junit.xml -s -x \
            --test_model="$MODEL" --test_dataset="$DATASET" --test_task="$TASK" \
            --persistent_cache_dir="$MEDS_DEV_CACHE_DIR" --cache_dataset=all --reuse_cached_dataset=all \
            --download_cache_dir="$MEDS_DEV_DOWNLOAD_DIR"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./junit.xml

  # ---------------------------------------------------------------------------
  # Job 8: Summary — report what ran (named run_tests_ubuntu for branch ruleset compatibility)
  # ---------------------------------------------------------------------------
  run_tests_ubuntu:
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        determine-scope,
        fast-checks,
        dataset-lane,
        task-lane,
        model-lane,
        full-integration-setup,
        full-integration,
      ]
    steps:
      - name: Write summary
        run: |
          echo "### CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| fast-checks | ${{ needs.fast-checks.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| dataset-lane | ${{ needs.dataset-lane.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| task-lane | ${{ needs.task-lane.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| model-lane | ${{ needs.model-lane.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| full-integration-setup | ${{ needs.full-integration-setup.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| full-integration | ${{ needs.full-integration.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scope reason**: ${{ needs.determine-scope.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check required jobs
        env:
          DETERMINE_SCOPE_RESULT: ${{ needs.determine-scope.result }}
          FAST_CHECKS_RESULT: ${{ needs.fast-checks.result }}
          DATASET_LANE_RESULT: ${{ needs.dataset-lane.result }}
          TASK_LANE_RESULT: ${{ needs.task-lane.result }}
          MODEL_LANE_RESULT: ${{ needs.model-lane.result }}
          FULL_INTEGRATION_SETUP_RESULT: ${{ needs.full-integration-setup.result }}
          FULL_INTEGRATION_RESULT: ${{ needs.full-integration.result }}
          RUN_FULL: ${{ needs.determine-scope.outputs.run_full }}
          DOCS_ONLY: ${{ needs.determine-scope.outputs.docs_only }}
          CHANGED_DATASETS: ${{ needs.determine-scope.outputs.changed_datasets }}
          CHANGED_TASKS: ${{ needs.determine-scope.outputs.changed_tasks }}
          CHANGED_MODELS: ${{ needs.determine-scope.outputs.changed_models }}
        run: |
          set -uo pipefail
          FAILED=""

          # determine-scope must SUCCEED: every downstream gate reads its outputs, so if it
          # failed/was cancelled the lanes were skipped for the wrong reason and a green summary
          # would be a false pass.
          if [[ "$DETERMINE_SCOPE_RESULT" != "success" ]]; then
            FAILED="$FAILED determine-scope(=$DETERMINE_SCOPE_RESULT)"
          fi

          # fast-checks always runs; require it to SUCCEED. Checking "!= failure" would let a
          # cancelled or skipped fast-checks slip through as a pass.
          if [[ "$FAST_CHECKS_RESULT" != "success" ]]; then
            FAILED="$FAILED fast-checks(=$FAST_CHECKS_RESULT)"
          fi

          # For an integration lane, a "skipped" result is only acceptable when the scope did not
          # select it. If the scope expected the lane to run, it must have succeeded; anything else
          # (skipped/cancelled/failure) means the gate and the job disagreed.
          check_lane() {
            local name="$1" result="$2" expected="$3"
            if [[ "$expected" == "true" ]]; then
              if [[ "$result" != "success" ]]; then
                FAILED="$FAILED $name(expected-run,=$result)"
              fi
            else
              if [[ "$result" != "skipped" ]]; then
                FAILED="$FAILED $name(expected-skip,=$result)"
              fi
            fi
          }

          # Reconstruct each lane's gating condition from the scope outputs (see the lane `if:`s).
          full_expected="false"; ds_expected="false"; tk_expected="false"; md_expected="false"
          if [[ "$RUN_FULL" == "true" ]]; then
            full_expected="true"
          elif [[ "$DOCS_ONLY" != "true" ]]; then
            if [[ "$CHANGED_DATASETS" != "[]" ]]; then ds_expected="true"; fi
            if [[ "$CHANGED_TASKS" != "[]" ]]; then tk_expected="true"; fi
            if [[ "$CHANGED_MODELS" != "[]" ]]; then md_expected="true"; fi
          fi

          check_lane dataset-lane "$DATASET_LANE_RESULT" "$ds_expected"
          check_lane task-lane "$TASK_LANE_RESULT" "$tk_expected"
          check_lane model-lane "$MODEL_LANE_RESULT" "$md_expected"
          check_lane full-integration-setup "$FULL_INTEGRATION_SETUP_RESULT" "$full_expected"
          # A matrix job's result is "success" only if every combination's job succeeded.
          check_lane full-integration "$FULL_INTEGRATION_RESULT" "$full_expected"

          if [[ -n "$FAILED" ]]; then
            echo "Required-job check failed:$FAILED"
            exit 1
          fi
          echo "All required jobs completed as expected (scope: run_full=$RUN_FULL docs_only=$DOCS_ONLY)."
