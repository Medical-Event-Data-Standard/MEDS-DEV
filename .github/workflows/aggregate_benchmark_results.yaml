name: Aggregate Benchmark Results

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  aggregate-results:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the _results branch
        uses: actions/checkout@v4
        with:
          ref: _results
          path: results-branch

      - name: Check out _web branch
        uses: actions/checkout@v4
        with:
          ref: _web
          path: web-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MEDS-DEV from PyPI
        run: pip install meds-dev

      - name: Aggregate results
        run: |
          mkdir -p web-branch/results
          meds-dev-aggregate-results \
            --input_dir results-branch/_results \
            --output_path web-branch/results/all_results.json \
            --do_overwrite

      - name: Commit and push to _web branch
        if: success()
        working-directory: web-branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add results/all_results.json
          if git diff --cached --quiet; then
            echo "No changes to all_results.json; skipping commit."
          else
            git commit -m "Update aggregated results from _results"
            # Other workflows also push to _web (results/ vs. entities/), so a push can be
            # rejected as non-fast-forward. They touch disjoint files, so rebasing onto the
            # latest _web is always conflict-free; retry a few times before giving up.
            for attempt in 1 2 3 4 5; do
              if git push origin _web; then
                exit 0
              fi
              echo "Push to _web rejected (attempt ${attempt}); rebasing onto latest _web and retrying."
              sleep $((attempt * 5))
              git pull --rebase origin _web
            done
            echo "::error::Failed to push to _web after 5 attempts."
            exit 1
          fi
