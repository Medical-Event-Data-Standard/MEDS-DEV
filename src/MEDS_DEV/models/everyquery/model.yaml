metadata:
  description: >-
    EveryQuery (conditional multitask) used zero-shot. The model is pretrained, without any task or label, to
    answer "does code c occur in window W, given these answers about earlier windows?". A task's ACES
    criteria are translated into such queries, the model scores them, and the scores are decoded into one
    probability per prediction time. Every difference between the task and the quantity that is answered is
    recorded next to the predictions, in `relaxations.yaml`.
  links:
    - https://github.com/payalchandak/EveryQuery
    - https://pypi.org/project/meds-algorithm-everyquery/
  contacts:
    - name: "Florent Pollet"
      github_username: "florian6973"
# The model's package requires Python 3.12.
python: "3.12"
profile: zero_shot_direct
steps:
  # Each step publishes its artifact as a new subdirectory of its {step_dir}.
  # A demo run uses demo_config.yaml (a small model, trained briefly); otherwise EveryQuery's own defaults.

  # Tensorizes the dataset and builds the code ontology. The vocabulary is fitted on the train split.
  # A demo run uses one polars thread: with more, EveryQuery's preprocessing needs about 15 GB of memory on
  # the eICU demo (5 GB with one), which is more than a standard CI machine has.
  preprocess_data: |-
    CONFIG=$([ "{demo}" = "True" ] && echo "config_file={model_dir}/demo_config.yaml" || true)
    if [ "{demo}" = "True" ]; then export POLARS_MAX_THREADS=1; fi
    everyquery preprocess_data --profile zero_shot_direct \
        "external_meds_dir={dataset_dir}" "external_predicates_file={predicates_path}" \
        "output_data_dir={step_dir}/data" $CONFIG

  # Self-supervised: samples query sequences on the train and tuning splits, then trains the model.
  pretrain: |-
    CONFIG=$([ "{demo}" = "True" ] && echo "config_file={model_dir}/demo_config.yaml" || true)
    everyquery pretrain --profile zero_shot_direct \
        "input_data_dir={preprocess_data_dir}/data" \
        "output_pretrained_algorithm_dir={step_dir}/pretrained" $CONFIG

  # Translates the task into queries, scores them and decodes them. The labels are only attached to the
  # predictions, for evaluation, after the probabilities are final.
  predict_zero_shot_direct: |-
    CONFIG=$([ "{demo}" = "True" ] && echo "config_file={model_dir}/demo_config.yaml" || true)
    everyquery predict_zero_shot_direct --profile zero_shot_direct \
        "input_data_dir={preprocess_data_dir}/data" \
        "input_pretrained_algorithm_dir={pretrain_dir}/pretrained" \
        "external_index_dir={labels_dir}" "splits=[{split}]" \
        "external_task_criteria_file={task_criteria_path}" "external_predicates_file={predicates_path}" \
        "external_evaluation_labels_dir={labels_dir}" \
        "output_predictions_dir={step_dir}/predictions" $CONFIG
