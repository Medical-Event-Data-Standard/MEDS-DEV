schema_version: 2
metadata:
  description: >-
    The GenHPF model. See the referenced paper for full details. This version of the GenHPF model uses
    default hyperparameters. Note that we need to preprocess MEDS dataset to match the input
    format for the GenHPF model, so the `preprocess` step runs before training the model, and can
    take quite a long time. The processed data will be saved in the `data` directory of the
    `preprocess` step, and the trained model checkpoint will be saved in the `checkpoints`
    directory of the `train` step. The `predict` step will load the trained checkpoint
    `checkpoints/checkpoint_best.pt` and output predictions for the test subset (specified by
    `split`; e.g., `held_out`) in its `predictions.parquet` file, which should be compatible with
    the meds-evaluation pipeline.
  links:
    - https://arxiv.org/abs/2207.09858
  contacts:
    - name: "Jungwoo Oh"
      github_username: "jwoo5"
profile: supervised
steps:
  # Preprocessing is restricted to the task's cohort (`--cohort`), so it is task-scoped.
  preprocess:
    scope: task
    command: |-
      python {model_dir}/prepare_codes_metadata.py "{dataset_dir}/metadata" "{step_dir}/metadata"

      genhpf-preprocess-meds \
        "{dataset_dir}/data" \
        "--cohort={labels_dir}" \
        "--metadata_dir={step_dir}/metadata" \
        "--output_dir={step_dir}/data" \
        "--workers=32" \
        "--debug={demo}" \
        "--skip-if-exists"

  train:
    scope: task
    needs: [preprocess]
    command: |-
      genhpf-train \
        "hydra.run.dir={step_dir}" \
        "dataset.data={preprocess_dir}/data" \
        "checkpoint.save_dir={step_dir}/checkpoints" \
        "common.debug={demo}" \
        "--config-dir={model_dir}" \
        "--config-name=genhpf_train"

  predict:
    scope: task
    needs: [preprocess, train]
    predict: true
    command: |-
      genhpf-test \
        "hydra.run.dir={step_dir}" \
        "dataset.data={preprocess_dir}/data" \
        "meds.output_predictions=true" \
        "meds.labels_dir={labels_dir}" \
        "meds.output_dir={step_dir}" \
        "checkpoint.load_checkpoint={train_dir}/checkpoints/checkpoint_best.pt" \
        "dataset.test_subset={split}" \
        "common.debug={demo}" \
        "--config-dir={model_dir}" \
        "--config-name=genhpf_predict"

      mv {step_dir}/{split}.parquet {step_dir}/predictions.parquet
