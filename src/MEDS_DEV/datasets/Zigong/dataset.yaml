metadata:
  description: >-
    A MEDS version of the Zigong Fourth People's Hospital ICU infection database.
  links:
    - https://github.com/rvandewater/ZIGONG_MEDS
    - https://physionet.org/content/icu-infection-zigong-fourth/1.1/
    - https://doi.org/10.13026/xpt9-z726
  contacts:
    - name: "Robin P. van de Water"
      github_username: "rvandewater"
  access_policy: public_with_approval
  access_details: >-
    Requires a credentialed PhysioNet account, completion of the required CITI training, and acceptance
    of the PhysioNet Credentialed Health Data Use Agreement for the Zigong ICU infection database.
commands:
  build_full: >-
    meds-extract-run spec=Zigong
    download_dest_dir="{temp_dir}/raw"
    output_dir="{output_dir}"
