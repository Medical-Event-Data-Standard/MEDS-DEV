    code:
      {
        regex: "^(DIAGNOSIS//ICD//(10|10CM)//(M80|M84|S22|S32|S42|S52|S72)|DIAGNOSIS//ICD//(9|9CM)//(805|807|808|810|811|812|813|820|7331|73393|73394|73396|73397|73398|9053|9055|V542))",
