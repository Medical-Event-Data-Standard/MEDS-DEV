  # Audit 2026-11: most osteoporotic fractures (spine, hip, wrist, humerus, ribs, pelvis) are coded as injuries (S22,
  # S32, S42, S52, S72; ICD-9 805-820), which M80/M84 miss. On MIMIC-IV: positives 201 -> 462, 1,614 patients with an
  # earlier fracture now excluded, AUROC 0.591 -> 0.686.
