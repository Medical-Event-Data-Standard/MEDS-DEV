  # Audit 2026-11: an existing foot ulcer coded in the skin chapter (L97.4/L97.5, ICD-9 707.14/707.15) was not
  # excluded, and before 2015 no ulcer could be labelled. On MIMIC-IV: positives 375 -> 995, 1,008 patients with an
  # existing ulcer excluded, AUROC 0.893 -> 0.815.
  diabetic_foot_ulcer:
    code: { regex: "^(DIAGNOSIS//ICD//(10|10CM)//(E10621|E11621|E13621|L974|L975)|DIAGNOSIS//ICD//(9|9CM)//(70714|70715))" }
  # Audit 2026-11: the group missed E1x.22 (diabetic CKD, the commonest diabetic kidney code) and E1x.29, and on the
