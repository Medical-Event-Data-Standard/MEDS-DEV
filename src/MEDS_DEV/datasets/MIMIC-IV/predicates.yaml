predicates:
  hospital_admission:
    code: { regex: "^HOSPITAL_ADMISSION//.*" }
  hospital_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE//.*" }

  ED_registration:
    code: ED_REGISTRATION
  ED_discharge:
    code: ED_OUT

  icu_admission:
    code: { regex: "^ICU_ADMISSION//.*" }
  icu_discharge:
    code: { regex: "^ICU_DISCHARGE//.*" }

  creatinine_1:
    code: LAB//RESULT//50912//mg/dL
  creatinine_2:
    code: LAB//RESULT//52546//mg/dL
  abnormally_high_creatinine_1:
    code: LAB//RESULT//50912//mg/dL
    value_min: 1.3 # mg/dL
    value_min_inclusive: False
    value_max: null
  abnormally_high_creatinine_2:
    code: LAB//RESULT//52546//mg/dL
    value_min: 1.3 # mg/dL
    value_min_inclusive: False
    value_max: null
  creatinine:
    expr: or(creatinine_1, creatinine_2)
  abnormally_high_creatinine:
    expr: or(abnormally_high_creatinine_1, abnormally_high_creatinine_2)

  sodium_1:
    code: ICU_CHART//220645//mEq/L
  sodium_2:
    code: LAB//RESULT//50983//mEq/L
  sodium_3:
    code: LAB//RESULT//52623//mEq/L
  abnormally_low_sodium_1:
    code: ICU_CHART//220645//mEq/L
    value_min: null
    value_max: 135 # mEq/L
    value_max_inclusive: False
  abnormally_low_sodium_2:
    code: LAB//RESULT//50983//mEq/L
    value_min: null
    value_max: 135 # mEq/L
    value_max_inclusive: False
  abnormally_low_sodium_3:
    code: LAB//RESULT//52623//mEq/L
    value_min: null
    value_max: 135 # mEq/L
    value_max_inclusive: False
  sodium:
    expr: or(sodium_1, sodium_2, sodium_3)
  abnormally_low_sodium:
    expr: or(abnormally_low_sodium_1, abnormally_low_sodium_2, abnormally_low_sodium_3)

  bicarbonate_1:
    code: ICU_CHART//227443//mEq/L
  bicarbonate_2:
    code: LAB//RESULT//50882//mEq/L
  abnormally_low_bicarbonate_1:
    code: ICU_CHART//227443//mEq/L
    value_min: null
    value_max: 22 # mEq/L
    value_max_inclusive: False
  abnormally_low_bicarbonate_2:
    code: LAB//RESULT//50882//mEq/L
    value_min: null
    value_max: 22 # mEq/L
    value_max_inclusive: False
  bicarbonate:
    expr: or(bicarbonate_1, bicarbonate_2)
  abnormally_low_bicarbonate:
    expr: or(abnormally_low_bicarbonate_1, abnormally_low_bicarbonate_2)

  hemoglobin_1:
    code: ICU_CHART//220228//g/dl
  # Audit 2026-11: hemoglobin_2 was only the blood-gas code 50811 (about 46 k patients); the full blood count 51222
  # (about 299 k) was missing, so the anaemia label fired almost only for ICU patients (prevalence 6.5%, ICU-charted
  # weight as top feature). With 51222: prevalence 41.2%, in line with eICU, INSPIRE, NWICU and HiRID.
  hemoglobin_2:
    code: { any: [LAB//RESULT//50811//g/dL, LAB//RESULT//51222//g/dL] }
  abnormally_low_hemoglobin_1:
    code: ICU_CHART//220228//g/dl
    value_min: null
    value_max: 13 # g/dL
    value_max_inclusive: False
  abnormally_low_hemoglobin_2:
    code: { any: [LAB//RESULT//50811//g/dL, LAB//RESULT//51222//g/dL] }
    value_min: null
    value_max: 13 # g/dL
    value_max_inclusive: False
  hemoglobin:
    expr: or(hemoglobin_1, hemoglobin_2)
  abnormally_low_hemoglobin:
    expr: or(abnormally_low_hemoglobin_1, abnormally_low_hemoglobin_2)

  wbc_1:
    code: ICU_CHART//220546//K/uL
  # Audit 2026-11: wbc_2 was 51300 (about 5 k patients) instead of the blood-count leukocytes 51301 (about 299 k):
  # prevalence 4.8% -> 15.4% with 51301.
  wbc_2:
    code: { any: [LAB//RESULT//51300//K/uL, LAB//RESULT//51301//K/uL] }
  abnormally_high_wbc_1:
    code: ICU_CHART//220546//K/uL
    value_min: 11 # K/uL
    value_min_inclusive: False
    value_max: null
  abnormally_high_wbc_2:
    code: { any: [LAB//RESULT//51300//K/uL, LAB//RESULT//51301//K/uL] }
    value_min: 11 # K/uL
    value_min_inclusive: False
    value_max: null
  wbc:
    expr: or(wbc_1, wbc_2)
  abnormally_high_wbc:
    expr: or(abnormally_high_wbc_1, abnormally_high_wbc_2)

  platelets_1:
    code: ICU_CHART//227457//K/uL
  platelets_2:
    code: LAB//RESULT//51265//K/uL
  abnormally_low_platelets_1:
    code: ICU_CHART//227457//K/uL
    value_min: null
    value_max: 150 # K/uL
    value_max_inclusive: False
  abnormally_low_platelets_2:
    code: LAB//RESULT//51265//K/uL
    value_min: null
    value_max: 150 # K/uL
    value_max_inclusive: False
  platelets:
    expr: or(platelets_1, platelets_2)
  abnormally_low_platelets:
    expr: or(abnormally_low_platelets_1, abnormally_low_platelets_2)

  map_1:
    code: ICU_CHART//220052//mmHg
  map_2:
    code: ICU_CHART//220181//mmHg
  map_3:
    code: ICU_CHART//225312//mmHg
  abnormally_low_map_1:
    code: ICU_CHART//220052//mmHg
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  abnormally_low_map_2:
    code: ICU_CHART//220181//mmHg
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  abnormally_low_map_3:
    code: ICU_CHART//225312//mmHg
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  map:
    expr: or(map_1, map_2, map_3)
  abnormally_low_map:
    expr: or(abnormally_low_map_1, abnormally_low_map_2, abnormally_low_map_3)

  # Diagnosis groups by ICD root. Generated from the dataset's suMEDS code catalog (TaskWiki task_templates).
  # Each ICD prefix accepts the code layout before and after the 2026-11 ETL releases, e.g. DIAGNOSIS//ICD//(10|10CM)//;
  # the old alternative can be dropped once the dataset's pin is on the new release.
  heart_failure:
    code:
      {
        regex: "^(DIAGNOSIS//ICD//(10|10CM)//I50|DIAGNOSIS//ICD//(9|9CM)//428)",
      }
  essential_hypertension:
    code:
      {
        regex: "^(DIAGNOSIS//ICD//(10|10CM)//I10|DIAGNOSIS//ICD//(9|9CM)//401)",
      }
  acute_myocardial_infarction:
    code:
      {
        regex: "^(DIAGNOSIS//ICD//(10|10CM)//(I21|I22)|DIAGNOSIS//ICD//(9|9CM)//410)",
      }
  atrial_fibrillation:
    code:
      {
        regex: "^(DIAGNOSIS//ICD//(10|10CM)//I48|DIAGNOSIS//ICD//(9|9CM)//4273)",
      }
  ischemic_stroke:
    code:
      {
        regex: "^(DIAGNOSIS//ICD//(10|10CM)//I63|DIAGNOSIS//ICD//(9|9CM)//(43301|43311|43321|43331|43381|43391|434))",
      }
  acute_kidney_failure:
    code:
      {
        regex: "^(DIAGNOSIS//ICD//(10|10CM)//N17|DIAGNOSIS//ICD//(9|9CM)//(5836|584))",
