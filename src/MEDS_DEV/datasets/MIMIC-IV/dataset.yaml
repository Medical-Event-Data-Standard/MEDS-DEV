metadata:
  description: >-
    A MEDS version of MIMIC-IV.
  links:
    - https://github.com/mmcdermott/MIMIC_IV_MEDS
    - https://physionet.org/content/mimiciv/3.1/
    - https://www.nature.com/articles/s41597-022-01899-x
  contacts:
    - name: "Tom Pollard"
      github_username: "tompollard"
    - name: "Matthew McDermott"
      github_username: "mmcdermott"
commands:
  build_full: >-
    MEDS_extract-MIMIC_IV
    root_output_dir="{output_dir}"
    raw_input_dir="{temp_dir}/raw"
    pre_MEDS_dir="{temp_dir}/pre_MEDS"
    MEDS_output_dir="{output_dir}"
    log_dir="{output_dir}/.pipeline_logs"

  build_demo: >-
    MEDS_extract-MIMIC_IV
    root_output_dir="{output_dir}"
    do_demo=True
    raw_input_dir="{temp_dir}/raw"
    pre_MEDS_dir="{temp_dir}/pre_MEDS"
    MEDS_output_dir="{output_dir}"
    log_dir="{output_dir}/.pipeline_logs"
testing:
  demo:
    allowed_uncovered_predicate_codes:
      "LAB//RESULT//52546//mg/dL": >-
        Valid full-dataset creatinine code absent from the public MIMIC-IV 2.2 demo.
      "LAB//RESULT//52623//mEq/L": >-
        Valid full-dataset sodium code absent from the public MIMIC-IV 2.2 demo.
