metadata:
  description: >-
    A MEDS version of INSPIRE.
  links:
    - https://github.com/rvandewater/INSPIRE_MEDS
    - https://physionet.org/content/inspire/
  contacts:
    - name: "Robin P. van de Water"
      github_username: "rvandewater"
  access_policy: public_with_approval
  access_details: >-
    Requires a credentialed PhysioNet account, completion of the required CITI training, and acceptance
    of the Korea Credentialed Health Data Use Agreement for INSPIRE.

commands:
  build_full: >-
    MEDS_extract-INSPIRE "{temp_dir}"
    --raw-input-dir "{raw_input_dir}"
    --output-dir "{output_dir}"
