predicates:
  # Codes are those of HIRID-MEDS 0.1.0. HiRID covers ICU stays only: each subject is one admission to the
  # Bern University Hospital ICU, and nothing before or after it is recorded.
  #
  # `HOSPITAL_ADMISSION` is the ICU admission time and `HOSPITAL_DISCHARGE` the time of the subject's last
  # observation (HiRID records no discharge time). The ETL keeps these names from its earlier releases. They are
  # used for both the ICU and the hospital predicates: HiRID records no hospital admission or discharge, so the
  # hospital-level tasks are anchored on the ICU stay, as for SICdb. `MEDS_BIRTH` and `MEDS_DEATH` are present, so
  # the tasks' default `birth` and `death` predicates apply.
  hospital_admission:
    code: HOSPITAL_ADMISSION
  hospital_discharge:
    code: HOSPITAL_DISCHARGE
  icu_admission:
    code: HOSPITAL_ADMISSION
  icu_discharge:
    code: HOSPITAL_DISCHARGE

  # Observations are `OBSERVATION//<variable name>//<unit>`, with the name and unit from HiRID's variable
  # reference. A code is used when its LOINC (from the suMEDS crosswalk shipped with HIRID-MEDS) measures the
  # analyte in blood. Where the unit differs from the task's, the threshold is converted and both are given.
  # Every abnormal predicate is a plain code, so ACES applies its threshold; multi-code concepts are or(...).

  # LOINC 59826-8, Creatinine [Moles/volume] in Blood. 1.3 mg/dL x 88.4 (umol/L per mg/dL) = 114.92 umol/L.
  # Urine creatinine (14683-7) is excluded.
  creatinine:
    code: OBSERVATION//Creatinine [Moles/volume] in Blood//umol/l
  abnormally_high_creatinine:
    code: OBSERVATION//Creatinine [Moles/volume] in Blood//umol/l
    value_min: 114.92 # umol/L == 1.3 mg/dL
    value_min_inclusive: False
    value_max: null

  # LOINC 2947-0, Sodium [Moles/volume] in Blood (mmol/L == mEq/L). Urine sodium (2955-3) is excluded.
  sodium:
    code: OBSERVATION//Sodium [Moles/volume] in Blood//mmol/l
  abnormally_low_sodium:
    code: OBSERVATION//Sodium [Moles/volume] in Blood//mmol/l
    value_min: null
    value_max: 135 # mmol/L == mEq/L
    value_max_inclusive: False

  # LOINC 1960-4, Bicarbonate [Moles/volume] in Arterial blood (mmol/L == mEq/L). HiRID has no serum bicarbonate
  # or total CO2, so the blood-gas value is used.
  bicarbonate:
    code: OBSERVATION//Bicarbonate [Moles/volume] in Arterial blood//mmol/l
  abnormally_low_bicarbonate:
    code: OBSERVATION//Bicarbonate [Moles/volume] in Arterial blood//mmol/l
    value_min: null
    value_max: 22 # mmol/L == mEq/L
    value_max_inclusive: False

  # LOINC 718-7, Hemoglobin [Mass/volume] in Blood, and 30313-1, in Arterial blood. Both are in g/L (the two
  # codes spell the unit differently), so 13 g/dL = 130 g/L.
  hemoglobin_1:
    code: OBSERVATION//Hemoglobin [Mass/volume] in Blood//g/l
  hemoglobin_2:
    code: OBSERVATION//Hemoglobin [Mass/volume] in Arterial blood//g/L
  abnormally_low_hemoglobin_1:
    code: OBSERVATION//Hemoglobin [Mass/volume] in Blood//g/l
    value_min: null
    value_max: 130 # g/L == 13 g/dL
    value_max_inclusive: False
  abnormally_low_hemoglobin_2:
    code: OBSERVATION//Hemoglobin [Mass/volume] in Arterial blood//g/L
    value_min: null
    value_max: 130 # g/L == 13 g/dL
    value_max_inclusive: False
  hemoglobin:
    expr: or(hemoglobin_1, hemoglobin_2)
  abnormally_low_hemoglobin:
    expr: or(abnormally_low_hemoglobin_1, abnormally_low_hemoglobin_2)

  # LOINC 26464-8, Leukocytes [#/volume] in Blood (G/L == 10^9/L == K/uL). The neutrophil and band-form
  # percentages are excluded.
  wbc:
    code: OBSERVATION//Leukocytes [#/volume] in Blood//G/l
  abnormally_high_wbc:
    code: OBSERVATION//Leukocytes [#/volume] in Blood//G/l
    value_min: 11 # G/L == K/uL
    value_min_inclusive: False
    value_max: null

  # LOINC 26515-7, Platelets [#/volume] in Blood (G/L == K/uL).
  platelets:
    code: OBSERVATION//Platelets [#/volume] in Blood//G/l
  abnormally_low_platelets:
    code: OBSERVATION//Platelets [#/volume] in Blood//G/l
    value_min: null
    value_max: 150 # G/L == K/uL
    value_max_inclusive: False

  # Invasive and non-invasive mean arterial pressure (mmHg). The invasive signal is recorded as often as every
  # two minutes, so `abnormally_low_map` flags a single reading below 65 mmHg.
  map_1:
    code: OBSERVATION//Invasive mean arterial pressure//mmHg
  map_2:
    code: OBSERVATION//Non-invasive mean arterial pressure//mmHg
  abnormally_low_map_1:
    code: OBSERVATION//Invasive mean arterial pressure//mmHg
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  abnormally_low_map_2:
    code: OBSERVATION//Non-invasive mean arterial pressure//mmHg
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  map:
    expr: or(map_1, map_2)
  abnormally_low_map:
    expr: or(abnormally_low_map_1, abnormally_low_map_2)
