predicates:
  hospital_admission:
    code: { regex: "^HOSPITAL_ADMISSION//.*" }
  hospital_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE//.*" }

  # ED_registration and ED_discharge are intentionally not defined. eICU does
  # not provide native ED boundary events equivalent to MIMIC-IV's ED events.
  # Declare them here if MEDS-DEV adds explicit unsupported-predicate metadata.

  icu_admission:
    code: { regex: "^ICU_ADMISSION//.*" }
  icu_discharge:
    code: { regex: "^ICU_DISCHARGE//.*" }

  creatinine:
    code: LAB//RESULT//creatinine//mg/dL
  abnormally_high_creatinine:
    code: LAB//RESULT//creatinine//mg/dL
    value_min: 1.3 # mg/dL
    value_min_inclusive: False
    value_max: null

  sodium:
    code: LAB//RESULT//sodium//mmol/L
  abnormally_low_sodium:
    code: LAB//RESULT//sodium//mmol/L
    value_min: null
    value_max: 135 # mEq/L
    value_max_inclusive: False

  bicarbonate_1:
    code: LAB//RESULT//bicarbonate//mmol/L
  bicarbonate_2:
    code: LAB//RESULT//HCO3//mmol/L
  abnormally_low_bicarbonate_1:
    code: LAB//RESULT//bicarbonate//mmol/L
    value_min: null
    value_max: 22 # mEq/L
    value_max_inclusive: False
  abnormally_low_bicarbonate_2:
    code: LAB//RESULT//HCO3//mmol/L
    value_min: null
    value_max: 22 # mEq/L
    value_max_inclusive: False
  bicarbonate:
    expr: or(bicarbonate_1, bicarbonate_2)
  abnormally_low_bicarbonate:
    expr: or(abnormally_low_bicarbonate_1, abnormally_low_bicarbonate_2)

  hemoglobin:
    code: LAB//RESULT//Hgb//g/dL
  abnormally_low_hemoglobin:
    code: LAB//RESULT//Hgb//g/dL
    value_min: null
    value_max: 13 # g/dL
    value_max_inclusive: False

  wbc:
    code: LAB//RESULT//WBC x 1000//K/mcL
  abnormally_high_wbc:
    code: LAB//RESULT//WBC x 1000//K/mcL
    value_min: 11 # K/uL
    value_min_inclusive: False
    value_max: null

  platelets:
    code: LAB//RESULT//platelets x 1000//K/mcL
  abnormally_low_platelets:
    code: LAB//RESULT//platelets x 1000//K/mcL
    value_min: null
    value_max: 150 # K/uL
    value_max_inclusive: False

  map_1:
    code: VITALS//APERIODIC//BP//NONINVASIVE_MEAN
  map_2:
    code: VITALS//PERIODIC//BP//SYSTEMIC_MEAN
  abnormally_low_map_1:
    code: VITALS//APERIODIC//BP//NONINVASIVE_MEAN
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  abnormally_low_map_2:
    code: VITALS//PERIODIC//BP//SYSTEMIC_MEAN
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  map:
    expr: or(map_1, map_2)
  abnormally_low_map:
    expr: or(abnormally_low_map_1, abnormally_low_map_2)
