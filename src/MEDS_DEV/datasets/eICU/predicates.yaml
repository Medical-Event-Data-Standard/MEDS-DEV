predicates:
  hospital_admission:
    code: { regex: "^HOSPITAL_ADMISSION//.*" }
  hospital_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE//.*" }

  # ED_registration and ED_discharge are intentionally not defined. eICU does
  # not provide native ED boundary events equivalent to MIMIC-IV's ED events.
  # Declare them here if MEDS-DEV adds explicit unsupported-predicate metadata.

  icu_admission:
    code: { regex: "^ICU_ADMISSION//.*" }
  icu_discharge:
    code: { regex: "^ICU_DISCHARGE//.*" }

  creatinine:
    code: LAB//RESULT//creatinine//mg/dL
  abnormally_high_creatinine:
    code: LAB//RESULT//creatinine//mg/dL
    value_min: 1.3 # mg/dL
    value_min_inclusive: False
    value_max: null

  sodium:
    code: LAB//RESULT//sodium//mmol/L
  abnormally_low_sodium:
    code: LAB//RESULT//sodium//mmol/L
    value_min: null
    value_max: 135 # mEq/L
    value_max_inclusive: False

  bicarbonate_1:
    code: LAB//RESULT//bicarbonate//mmol/L
  bicarbonate_2:
    code: LAB//RESULT//HCO3//mmol/L
  abnormally_low_bicarbonate_1:
    code: LAB//RESULT//bicarbonate//mmol/L
    value_min: null
    value_max: 22 # mEq/L
    value_max_inclusive: False
  abnormally_low_bicarbonate_2:
    code: LAB//RESULT//HCO3//mmol/L
    value_min: null
    value_max: 22 # mEq/L
    value_max_inclusive: False
  bicarbonate:
    expr: or(bicarbonate_1, bicarbonate_2)
  abnormally_low_bicarbonate:
    expr: or(abnormally_low_bicarbonate_1, abnormally_low_bicarbonate_2)

  hemoglobin:
    code: LAB//RESULT//Hgb//g/dL
  abnormally_low_hemoglobin:
    code: LAB//RESULT//Hgb//g/dL
    value_min: null
    value_max: 13 # g/dL
    value_max_inclusive: False

  wbc:
    code: LAB//RESULT//WBC x 1000//K/mcL
  abnormally_high_wbc:
    code: LAB//RESULT//WBC x 1000//K/mcL
    value_min: 11 # K/uL
    value_min_inclusive: False
    value_max: null

  platelets:
    code: LAB//RESULT//platelets x 1000//K/mcL
  abnormally_low_platelets:
    code: LAB//RESULT//platelets x 1000//K/mcL
    value_min: null
    value_max: 150 # K/uL
    value_max_inclusive: False

  map_1:
    code: VITALS//APERIODIC//BP//NONINVASIVE_MEAN
  map_2:
    code: VITALS//PERIODIC//BP//SYSTEMIC_MEAN
  abnormally_low_map_1:
    code: VITALS//APERIODIC//BP//NONINVASIVE_MEAN
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  abnormally_low_map_2:
    code: VITALS//PERIODIC//BP//SYSTEMIC_MEAN
    value_min: null
    value_max: 65 # mmHg
    value_max_inclusive: False
  map:
    expr: or(map_1, map_2)
  abnormally_low_map:
    expr: or(abnormally_low_map_1, abnormally_low_map_2)

  # Diagnosis groups by ICD root. Generated from the dataset's suMEDS code catalog (TaskWiki task_templates).
  heart_failure:
    code:
      any:
        - "DIAGNOSIS//cardiovascular|shock / hypotension|sepsis|sepsis with single organ dysfunction- congestive heart failure"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|acute pulmonary edema"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|acute pulmonary edema|drug induced"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|acute pulmonary edema|due to hypertension"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|acute pulmonary edema|due to left ventricular dysfunction"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|acute pulmonary edema|due to malignant hypertension"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|acute pulmonary edema|due to myocardial ischemia or infarction"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|acute pulmonary edema|due to renal dysfunction"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|acute pulmonary edema|due to valvular disease"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|biventricular"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|combined systolic and diastolic"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|combined systolic and diastolic|acute"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|combined systolic and diastolic|acute on chronic"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|combined systolic and diastolic|chronic"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|cor pulmonale"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|decompensated"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|diastolic"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|diastolic|acute"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|diastolic|acute on chronic"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|diastolic|chronic"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|left-sided"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|right-sided"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|systolic"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|systolic|acute"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|systolic|acute on chronic"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|congestive heart failure|systolic|chronic"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|low cardiac output state"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|low cardiac output state|with lactic acidosis"
        - "DIAGNOSIS//cardiovascular|ventricular disorders|low cardiac output state|with renal insufficiency"
        - "DIAGNOSIS//pulmonary|disorders of vasculature|pulmonary hemorrhage|due to left sided heart failure"
        - "DIAGNOSIS//surgery|acute cardiac problems|congestive heart failure"
  essential_hypertension:
    code:
      any:
        - "DIAGNOSIS//cardiovascular|vascular disorders|hypertension"
        - "DIAGNOSIS//cardiovascular|vascular disorders|hypertension|controlled"
        - "DIAGNOSIS//cardiovascular|vascular disorders|hypertension|hypertensive emergency/urgency"
        - "DIAGNOSIS//cardiovascular|vascular disorders|hypertension|malignant"
        - "DIAGNOSIS//cardiovascular|vascular disorders|hypertension|malignant|with altered mental status"
        - "DIAGNOSIS//cardiovascular|vascular disorders|hypertension|uncontrolled"
