        - "DIAGNOSIS//cardiovascular|arrhythmias|atrial flutter"
        - "DIAGNOSIS//cardiovascular|arrhythmias|atrial flutter|1:2 conduction"
        - "DIAGNOSIS//cardiovascular|arrhythmias|atrial flutter|with hemodynamic compromise"
        - "DIAGNOSIS//cardiovascular|arrhythmias|atrial flutter|with variable conduction"
