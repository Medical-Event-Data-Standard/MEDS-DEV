metadata:
  description: >-
    A MEDS version of the structured EHR modality of INSPECT, a Stanford Medicine dataset of patients who
    underwent CT pulmonary angiography, converted from its STARR-OMOP tables with meds_etl.
  links:
    - https://som-shahlab.github.io/inspect-website/
    - https://doi.org/10.71718/aqrb-et67
    - https://arxiv.org/abs/2311.10798
    - https://github.com/Medical-Event-Data-Standard/meds_etl
  contacts:
    - name: "Robin P. van de Water"
      github_username: "rvandewater"
  access_policy: public_with_approval
  access_details: >-
    The de-identified dataset is available for non-commercial research use under the INSPECT data use
    agreement. The EHR tables are distributed through Stanford's Redivis platform and the CT images through
    the Stanford AIMI shared datasets portal.

commands:
  build_full: >-
    echo "INSPECT is distributed as STARR-OMOP tables and must be downloaded manually after accepting its
    data use agreement (see https://som-shahlab.github.io/inspect-website/), then converted to MEDS with
    meds_etl_omop (see src/MEDS_DEV/datasets/INSPECT/README.md). Pass the converted MEDS directory as
    dataset_dir to meds-dev-task and meds-dev-model instead of building it." >&2 && exit 1
