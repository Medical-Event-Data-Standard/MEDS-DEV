# Predicates for ALOTT (ALOTT-MEDS, MESSY spec). Reasoning: README.md.
# Can support: the six abnormal_lab blood tasks, with caveats. Not supported: mortality/in_icu (no death
# anywhere in the release) and abnormal_lab/vital/hypotension (no blood pressure in the EMR flowsheet).
# Labs carry only a result *date* and are placed at 23:59:59, so the tasks' 24 h windows act as calendar
# days (input = admission day, target = next day). There is no birth date or age, so the age >= 18
# window cannot exclude children. Codes are LAB//RESULT//<panel>//<component>; units are US (no unit in
# the code; medians match mg/dL, mmol/L, g/dL, K/uL). Panels seen in < 20 subjects are not listed.

predicates:
  hospital_admission:
    code: { regex: "^HOSPITAL_ADMISSION//.*" }
  hospital_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE//.*" }
  # Needed because metabolic_acidosis stops at ICU discharge. Do NOT list ALOTT for mortality/in_icu:
  # with no death events that task still runs, but every label is False.
  icu_admission:
    code: ICU_ADMISSION
  icu_discharge:
    code: ICU_DISCHARGE

