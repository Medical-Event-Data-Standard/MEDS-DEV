metadata:
  description: >-
    A MEDS version of the EMR tables of the ALOTT bedside-EMR database.
  links:
    - https://github.com/rvandewater/ALOTT_MEDS
    - https://physionet.org/content/alott/1.0.0/
    - https://doi.org/10.13026/sbq5-dy17
  contacts:
    - name: "Robin P. van de Water"
      github_username: "rvandewater"
  access_policy: public_with_approval
  access_details: >-
    Restricted access: requires a PhysioNet account and acceptance of the PhysioNet Restricted Health
    Data Use Agreement for ALOTT.
commands:
  build_full: >-
    meds-extract-run spec=ALOTT
    download_dest_dir="{raw_input_dir}"
    output_dir="{output_dir}"
