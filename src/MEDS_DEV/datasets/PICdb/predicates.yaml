# Predicates for PICdb, with the codes of PICdb-MEDS at commit 2cbffc3 (see README.md).
# Supports mortality/in_icu/first_24h only. PICdb is paediatric (no admission at age 18 or older, many
# neonates), so the abnormal_lab tasks, which exclude patients aged 18 or younger and use adult thresholds, do
# not apply. Their lab codes are listed in README.md for paediatric task variants. There is no ICU MAP either:
# the chart data has only systolic and diastolic pressure, and MAP exists only intra-operatively.

predicates:
  hospital_admission:
    code: { regex: "^HOSPITAL_ADMISSION//.*" }
  hospital_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE//.*" }
  # ICU_ADMISSION//<unit> covers CICU, General ICU, NICU, PICU and SICU.
  icu_admission:
    code: { regex: "^ICU_ADMISSION//.*" }
  icu_discharge:
    code: { regex: "^ICU_DISCHARGE//.*" }
  # MEDS_DEATH (task default) coincides with the last ICU discharge for 968 of the 971 deaths.
