metadata:
  description: >-
    A MEDS version of the Paediatric Intensive Care (PIC) database.
  links:
    - https://github.com/rvandewater/PICdb_MEDS
    - https://physionet.org/content/picdb/1.1.0/
    - https://doi.org/10.13026/32x9-wv38
  contacts:
    - name: "Robin P. van de Water"
      github_username: "rvandewater"
  access_policy: public_with_approval
  access_details: >-
    Requires a credentialed PhysioNet account, completion of the required CITI training, and acceptance
    of the PhysioNet Credentialed Health Data Use Agreement for the PIC database.
commands:
  build_full: >-
    meds-extract-run spec=PICdb
    download_dest_dir="{raw_input_dir}"
    output_dir="{output_dir}"
