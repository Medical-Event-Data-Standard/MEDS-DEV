predicates:
  hospital_admission:
    code: { regex: "^HOSPITAL_ADMISSION//.*" }
  hospital_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE//.*" }

  ED_registration:
    code: ED_REGISTRATION
  ED_discharge:
    code: ED_OUT

  icu_admission:
    code: { regex: "^ICU_ADMISSION//.*" }
  icu_discharge:
    code: { regex: "^ICU_DISCHARGE//.*" }

  creatinine_1:
    code: { regex: "^LAB//100002//.*" }
  abnormally_high_creatinine_1:
    code: { regex: "^LAB//100002//.*" }
    value_min: 1.3 # mg/dL
    value_min_inclusive: False
    value_max: null
  creatinine:
    expr: creatinine_1
  abnormally_high_creatinine:
    expr: abnormally_high_creatinine_1

  sodium_1:
    code: { regex: "^LAB//100010//.*" }
  abnormally_low_sodium_1:
    code: { regex: "^LAB//100010//.*" }
    value_min: null
    value_max: 135 # mEq/L
    value_max_inclusive: False
  sodium:
    expr: sodium_1
  abnormally_low_sodium:
    expr: abnormally_low_sodium_1

  bicarbonate_1:
    code: { regex: "^LAB//100013//.*" }
  abnormally_low_bicarbonate_1:
    code: { regex: "^LAB//100013//.*" }
    value_min: null
    value_max: 22 # mEq/L
    value_max_inclusive: False
  bicarbonate:
    expr: bicarbonate_1
  abnormally_low_bicarbonate:
    expr: abnormally_low_bicarbonate_1

  hemoglobin_1:
    code: { regex: "^LAB//100007//.*" }
  abnormally_low_hemoglobin_1:
    code: { regex: "^LAB//100007//.*" }
    value_min: null
    value_max: 13 # g/dL
    value_max_inclusive: False
  hemoglobin:
    expr: hemoglobin_1
  abnormally_low_hemoglobin:
    expr: abnormally_low_hemoglobin_1

  wbc_1:
    code: { regex: "^LAB//100016//.*" }
  abnormally_high_wbc_1:
    code: { regex: "^LAB//100016//.*" }
    value_min: 11 # K/uL
    value_min_inclusive: False
    value_max: null
  wbc:
    expr: wbc_1
  abnormally_high_wbc:
    expr: abnormally_high_wbc_1

  platelets_1:
    code: { regex: "^LAB//100014//.*" }
  abnormally_low_platelets_1:
    code: { regex: "^LAB//100014//.*" }
    value_min: null
    value_max: 150 # K/uL
    value_max_inclusive: False
  platelets:
    expr: platelets_1
  abnormally_low_platelets:
    expr: abnormally_low_platelets_1

  # NWICU does not define a mean arterial pressure item in d_items. Its
  # available BP concepts are systolic/diastolic measurements, which are not
  # interchangeable with the MAP predicate used by the hypotension task.
