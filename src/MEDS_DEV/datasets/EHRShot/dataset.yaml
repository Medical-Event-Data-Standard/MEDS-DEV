metadata:
  description: >-
    EHRShot dataset from Stanford Medicine.
  links:
    - https://som-shahlab.github.io/ehrshot-website/docs/
  contacts:
    - name: "Robin P. van de Water"
      github_username: "rvandewater"
  access_policy: public_with_approval
  access_details: >-
    Requires signing the EHRSHOT Credentialed Health Data License and Data Use Agreement, a verified
    institutional affiliation, and valid CITI training in human research subject protection and HIPAA.

commands:
  build_full: >-
    echo "EHRShot is distributed in MEDS format and must be downloaded manually after signing its data use
    agreement (see https://som-shahlab.github.io/ehrshot-website/docs/). Pass the downloaded MEDS directory
    as dataset_dir to meds-dev-task and meds-dev-model instead of building it." >&2 && exit 1
