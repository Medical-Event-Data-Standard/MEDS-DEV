metadata:
  description:
    "Urinary retention (ICD-10 R33) within 1095 days of a patient's first diagnosis of benign prostatic hyperplasia
    (ICD-10 N40), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30 days after it are
    excluded. A record that ends before the target window is over is labelled negative. Source literature: Zhang et al. (2026).
    A multimodal and temporal foundation model for virtual patient representations at healthcare system scale.
    Patients who die before the end of the blackout are excluded."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - EHRShot
    - INSPECT
    - INSPIRE
    - MIMIC-IV
    - NWICU
predicates:
  benign_prostatic_hyperplasia: ???
  urinary_retention: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: benign_prostatic_hyperplasia
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      benign_prostatic_hyperplasia: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      urinary_retention: (None, 0)
      # Audit 2026-11: patients who die in the index admission or the blackout were kept; diagnoses are stamped at
      # discharge, so they were predicted at their death and were guaranteed negatives. Measured on this task: M013 on
      # mimic-iv, v2: Death exclusion removes 736 patients (6.4%) who died in the index admission or the 30-day
      # blackout and were guaranteed negatives; positives unchanged (692); AUROC 0.610 -> 0.632 [0.57-0.69]. Weak
      # signal: urinary retention after BPH is mostly driven by what the EHR does not hold (symptom scores, prostate
      # volume). Note: MCHC appears under two units (g/dL and %) in MIMIC-IV 0.4.0.
      death: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      urinary_retention: (None, 0)
      death: (None, 0)
  target:
    start: blackout.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: urinary_retention
