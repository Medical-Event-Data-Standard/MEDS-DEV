metadata:
  description:
    "Esophageal varices (ICD-10 I85) within 1095 days of a patient's first diagnosis of cirrhosis (ICD-10 K70.3,
    K71.7, K74), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30 days after it are
    excluded. A record that ends before the target window is over is labelled negative. Source literature: Zhang et al. (2026).
    A multimodal and temporal foundation model for virtual patient representations at healthcare system scale.
    Patients who die before the end of the blackout are excluded."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - EHRShot
    - INSPECT
    - MIMIC-IV
    - NWICU
predicates:
  cirrhosis: ???
  esophageal_varices: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: cirrhosis
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      cirrhosis: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      esophageal_varices: (None, 0)
      # Audit 2026-11: patients who die in the index admission or the blackout were kept; diagnoses are stamped at
      # discharge, so they were predicted at their death and were guaranteed negatives. Measured on this task: M024 on
      # mimic-iv, v2: Death exclusion removes 888 patients (15%); positives unchanged (609); AUROC 0.824 -> 0.797
      # [0.74-0.84]; platelets, AFP, bilirubin, PT, nadolol (prophylaxis started when portal hypertension is
      # suspected: mild intent proxy). HOSPITAL_DISCHARGE//DIED gone.
      death: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      esophageal_varices: (None, 0)
      death: (None, 0)
  target:
    start: blackout.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: esophageal_varices
