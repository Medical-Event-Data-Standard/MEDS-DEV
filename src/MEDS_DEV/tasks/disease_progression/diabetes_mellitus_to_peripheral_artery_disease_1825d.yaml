metadata:
  description:
    "Peripheral artery disease (ICD-10 I70.2, I70.3, I70.4, I70.5, I70.6, I70.7, I73.9) within 1825 days of a patient's
    first diagnosis of diabetes mellitus (ICD-10 E08, E09, E10, E11, E13), predicted at that diagnosis. Patients with the
    outcome before the diagnosis or in the 30 days after it are excluded. A record that ends before the target window is over
    is labelled negative. Source literature: Zhang et al. (2026). A multimodal and temporal foundation model for virtual patient
    representations at healthcare system scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - INSPECT
    - MC-MED
    - MIMIC-IV
    - NWICU
predicates:
  diabetes_mellitus: ???
  peripheral_artery_disease: ???
trigger: diabetes_mellitus
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      diabetes_mellitus: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      peripheral_artery_disease: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      peripheral_artery_disease: (None, 0)
  target:
    start: blackout.end
    end: start + 1795d
    start_inclusive: false
    end_inclusive: true
    label: peripheral_artery_disease
