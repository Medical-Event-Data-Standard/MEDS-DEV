metadata:
  description:
    "Type 2 diabetes (ICD-10 E11) within 1825 days of a patient's first diagnosis of obesity (ICD-10 E66.0, E66.1,
    E66.2, E66.8, E66.9), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30 days after
    it are excluded. A record that ends before the target window is over is labelled negative. Source literature: Zhang et
    al. (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare system scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - INSPECT
    - MIMIC-IV
    - NWICU
predicates:
  obesity: ???
  type_2_diabetes: ???
trigger: obesity
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      obesity: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      type_2_diabetes: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      type_2_diabetes: (None, 0)
  target:
    start: blackout.end
    end: start + 1795d
    start_inclusive: false
    end_inclusive: true
    label: type_2_diabetes
