metadata:
  description:
    "Type 2 diabetes (ICD-10 E11) within 1825 days of a patient's first diagnosis of obesity (ICD-10 E66.0, E66.1,
    E66.2, E66.8, E66.9), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30 days after
    it are excluded. A record that ends before the target window is over is labelled negative. Source literature: Zhang et
    al. (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare system scale.
    Patients who die before the end of the blackout are excluded.
    Patients with an HbA1c of 6.5% or more before the obesity diagnosis are excluded."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - INSPECT
    - MIMIC-IV
    - NWICU
predicates:
  obesity: ???
  type_2_diabetes: ???
  death:
    code:
      regex: MEDS_DEATH.*
  diabetic_range_hba1c: ???
trigger: obesity
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      obesity: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      type_2_diabetes: (None, 0)
      # Audit 2026-11: patients who die in the index admission or the 30-day blackout used to stay in the cohort;
      # diagnoses are stamped at discharge, so they were predicted at their death and were guaranteed negatives
      # (HOSPITAL_DISCHARGE//DIED was a top SHAP feature). Excluding them removed 4-15% of the cohorts on MIMIC-IV; on
      # atrial fibrillation -> stroke the AUROC fell from 0.704 to 0.574, so the original signal was mostly these
      # guaranteed negatives. Applied to this task's runs before they ran.
      death: (None, 0)
  baseline:
    # Audit 2026-11: an HbA1c >= 6.5% before the obesity diagnosis meets the diagnostic criterion for diabetes, so the
    # label marked when diabetes got coded. On MIMIC-IV it removed 2.4% of the cohort but 12% of the positives (748 ->
    # 661); AUROC 0.748 -> 0.743.
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    has:
      diabetic_range_hba1c: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      type_2_diabetes: (None, 0)
      death: (None, 0)
  target:
    start: blackout.end
    end: start + 1795d
    start_inclusive: false
    end_inclusive: true
    label: type_2_diabetes
