metadata:
  description:
    "Diabetic foot ulcer (ICD-10 E10.621, E11.621, E13.621) within 1825 days of a patient's first diagnosis of
    type 2 diabetes (ICD-10 E11), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30
    days after it are excluded. A record that ends before the target window is over is labelled negative. Source literature:
    Zhang et al. (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare system
    scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - MC-MED
    - MIMIC-IV
    - NWICU
predicates:
  type_2_diabetes: ???
  diabetic_foot_ulcer: ???
trigger: type_2_diabetes
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      type_2_diabetes: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      diabetic_foot_ulcer: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      diabetic_foot_ulcer: (None, 0)
  target:
    start: blackout.end
    end: start + 1795d
    start_inclusive: false
    end_inclusive: true
    label: diabetic_foot_ulcer
