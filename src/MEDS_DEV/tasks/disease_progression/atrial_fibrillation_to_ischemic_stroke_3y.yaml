metadata:
  description:
    "Ischemic stroke within 3 years of a patient's first atrial-fibrillation diagnosis, predicted at that diagnosis.
    Patients with a stroke before the diagnosis or in the 30 days after it are excluded. A record that ends before the target
    window is over is labelled negative. Source literature: Zhang et al. (2026). A multimodal and temporal foundation model
    for virtual patient representations at healthcare system scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - EHRShot
    - INSPECT
    - INSPIRE
    - MC-MED
    - MIMIC-IV
    - NWICU
predicates:
  atrial_fibrillation: ???
  ischemic_stroke: ???
trigger: atrial_fibrillation
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      atrial_fibrillation: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      ischemic_stroke: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      ischemic_stroke: (None, 0)
  target:
    start: blackout.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: ischemic_stroke
