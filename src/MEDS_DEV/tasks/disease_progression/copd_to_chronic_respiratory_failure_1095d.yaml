metadata:
  description:
    "Chronic respiratory failure (ICD-10 J96.1) within 1095 days of a patient's first diagnosis of chronic obstructive
    pulmonary disease (ICD-10 J44), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the
    30 days after it are excluded. A record that ends before the target window is over is labelled negative. Source literature:
    Zhang et al. (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare system
    scale.
    Patients who die before the end of the blackout are excluded."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - INSPECT
    - MIMIC-IV
    - NWICU
predicates:
  chronic_obstructive_pulmonary_disease: ???
  chronic_respiratory_failure: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: chronic_obstructive_pulmonary_disease
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      chronic_obstructive_pulmonary_disease: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      chronic_respiratory_failure: (None, 0)
      # Audit 2026-11: patients who die in the index admission or the blackout were kept; diagnoses are stamped at
      # discharge, so they were predicted at their death and were guaranteed negatives. Measured on this task: M030 on
      # mimic-iv, v2: Death exclusion removes 1,791 patients (9.4%); AUROC 0.732 -> 0.710 [0.58-0.82], 23 held-out
      # positives; bicarbonate (CO2 retention) and 'dependence on supplemental oxygen' at the index admission: label-
      # adjacent (oxygen dependence is close to chronic respiratory failure) but recorded before the prediction time.
      death: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      chronic_respiratory_failure: (None, 0)
      death: (None, 0)
  target:
    start: blackout.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: chronic_respiratory_failure
