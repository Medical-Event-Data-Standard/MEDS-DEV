metadata:
  description:
    "Chronic migraine (ICD-10 G43.7) within 365 days of a patient's first diagnosis of migraine (ICD-10 G43),
    predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30 days after it are excluded. A
    record that ends before the target window is over is labelled negative. Source literature: Zhang et al. (2026). A multimodal
    and temporal foundation model for virtual patient representations at healthcare system scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - INSPECT
    - MC-MED
predicates:
  migraine: ???
  chronic_migraine: ???
trigger: migraine
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      migraine: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      chronic_migraine: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      chronic_migraine: (None, 0)
  target:
    start: blackout.end
    end: start + 335d
    start_inclusive: false
    end_inclusive: true
    label: chronic_migraine
