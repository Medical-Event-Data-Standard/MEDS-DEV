metadata:
  description:
    "Alzheimer disease (ICD-10 G30) within 1095 days of a patient's first diagnosis of mild cognitive impairment
    (ICD-10 F06.7, G31.84), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30 days
    after it are excluded. A record that ends before the target window is over is labelled negative. Source literature: Zhang
    et al. (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare system scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - MIMIC-IV
predicates:
  mild_cognitive_impairment: ???
  alzheimer_disease: ???
trigger: mild_cognitive_impairment
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      mild_cognitive_impairment: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      alzheimer_disease: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      alzheimer_disease: (None, 0)
  target:
    start: blackout.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: alzheimer_disease
