metadata:
  description:
    "Pulmonary hypertension (ICD-10 I27.2) within 1095 days of a patient's first diagnosis of chronic obstructive
    pulmonary disease (ICD-10 J44), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the
    30 days after it are excluded. A record that ends before the target window is over is labelled negative. Source literature:
    Zhang et al. (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare system
    scale.
    Patients who die before the end of the blackout are excluded."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - INSPECT
    - MC-MED
    - MIMIC-IV
    - NWICU
predicates:
  chronic_obstructive_pulmonary_disease: ???
  pulmonary_hypertension: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: chronic_obstructive_pulmonary_disease
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      chronic_obstructive_pulmonary_disease: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      pulmonary_hypertension: (None, 0)
      # Audit 2026-11: patients who die in the index admission or the blackout were kept; diagnoses are stamped at
      # discharge, so they were predicted at their death and were guaranteed negatives. Measured on this task: M032 on
      # mimic-iv, v2: Death exclusion removes 1,538 patients (8.9%); AUROC 0.680 -> 0.654 [0.58-0.72]; NT-proBNP, BUN,
      # RDW, heart failure: plausible but weak. 3-year horizon censored at ~1 year in MIMIC-IV.
      death: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      pulmonary_hypertension: (None, 0)
      death: (None, 0)
  target:
    start: blackout.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: pulmonary_hypertension
