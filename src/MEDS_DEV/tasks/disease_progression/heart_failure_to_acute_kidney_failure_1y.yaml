metadata:
  description:
    "Acute kidney failure within 1 year of a patient's first heart-failure diagnosis, predicted at that diagnosis.
    Patients with acute kidney failure before the diagnosis or in the 30 days after it are excluded. A record that ends before
    the target window is over is labelled negative. Source literature: Zhang et al. (2026). A multimodal and temporal foundation
    model for virtual patient representations at healthcare system scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - INSPECT
    - MC-MED
    - MIMIC-IV
    - NWICU
predicates:
  heart_failure: ???
  acute_kidney_failure: ???
trigger: heart_failure
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      heart_failure: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      acute_kidney_failure: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      acute_kidney_failure: (None, 0)
  target:
    start: blackout.end
    end: start + 335d
    start_inclusive: false
    end_inclusive: true
    label: acute_kidney_failure
