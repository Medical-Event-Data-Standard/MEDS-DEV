metadata:
  description:
    "Chronic kidney disease stage 3 (ICD-10 N18.3) within 1825 days of a patient's first diagnosis of chronic
    kidney disease stage 2 (ICD-10 N18.2), predicted at that diagnosis. Patients with the outcome before the diagnosis or
    in the 30 days after it are excluded. A record that ends before the target window is over is labelled negative. Source
    literature: Zhang et al. (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare
    system scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - NWICU
predicates:
  chronic_kidney_disease_stage_2: ???
  chronic_kidney_disease_stage_3: ???
trigger: chronic_kidney_disease_stage_2
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      chronic_kidney_disease_stage_2: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      chronic_kidney_disease_stage_3: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      chronic_kidney_disease_stage_3: (None, 0)
  target:
    start: blackout.end
    end: start + 1795d
    start_inclusive: false
    end_inclusive: true
    label: chronic_kidney_disease_stage_3
