metadata:
  description:
    "Liver fibrosis (ICD-10 K74.0) within 1825 days of a patient's first diagnosis of non alcoholic fatty liver
    disease (ICD-10 K76.0), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30 days
    after it are excluded. A record that ends before the target window is over is labelled negative. Source literature: Zhang
    et al. (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare system scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - NWICU
predicates:
  non_alcoholic_fatty_liver_disease: ???
  liver_fibrosis: ???
trigger: non_alcoholic_fatty_liver_disease
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      non_alcoholic_fatty_liver_disease: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      liver_fibrosis: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      liver_fibrosis: (None, 0)
  target:
    start: blackout.end
    end: start + 1795d
    start_inclusive: false
    end_inclusive: true
    label: liver_fibrosis
