metadata:
  description:
    "Death within 1095 days of a patient's first diagnosis of aortic stenosis (ICD-10 I06.0, I06.2, I35.0, I35.2,
    Q23.0, Q25.3), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30 days after it
    are excluded. A record that ends before the target window is over is labelled negative. Source literature: Zhang et al.
    (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare system scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - MIMIC-IV
    - NWICU
    - SICdb
predicates:
  aortic_stenosis: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: aortic_stenosis
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      aortic_stenosis: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      death: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      death: (None, 0)
  target:
    start: blackout.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: death
