metadata:
  description:
    "Heart failure (ICD-10 I50) within 1095 days of a patient's first diagnosis of coronary artery disease (ICD-10
    I25), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30 days after it are excluded.
    A record that ends before the target window is over is labelled negative. Source literature: Zhang et al. (2026). A multimodal
    and temporal foundation model for virtual patient representations at healthcare system scale.
    Patients who die before the end of the blackout are excluded."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - INSPECT
    - INSPIRE
    - MC-MED
    - MIMIC-IV
    - NWICU
predicates:
  coronary_artery_disease: ???
  heart_failure: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: coronary_artery_disease
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      coronary_artery_disease: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      heart_failure: (None, 0)
      # Audit 2026-11: patients who die in the index admission or the blackout were kept; diagnoses are stamped at
      # discharge, so they were predicted at their death and were guaranteed negatives. Measured on this task: M021 on
      # mimic-iv, v2: Death exclusion removes 1,247 patients (4.5%); AUROC 0.740 -> 0.734 [0.70-0.77]; BUN, RDW,
      # creatinine, haemoglobin, blood pressure. 3-year horizon censored at ~1 year in MIMIC-IV.
      death: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      heart_failure: (None, 0)
      death: (None, 0)
  target:
    start: blackout.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: heart_failure
