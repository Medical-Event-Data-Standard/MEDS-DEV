metadata:
  description:
    "Acute myocardial infarction i21 (ICD-10 I21) within 1095 days of a patient's first diagnosis of coronary
    artery disease (ICD-10 I25), predicted at that diagnosis. Patients with the outcome before the diagnosis or in the 30
    days after it are excluded. A record that ends before the target window is over is labelled negative. Source literature:
    Zhang et al. (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare system
    scale.
    Patients who die before the end of the blackout are excluded."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=67
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - INSPECT
    - INSPIRE
    - MC-MED
    - MIMIC-IV
    - NWICU
predicates:
  coronary_artery_disease: ???
  acute_myocardial_infarction_i21: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: coronary_artery_disease
windows:
  first:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: false
    has:
      coronary_artery_disease: (None, 0)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      acute_myocardial_infarction_i21: (None, 0)
      # Audit 2026-11: patients who die in the index admission or the blackout were kept; diagnoses are stamped at
      # discharge, so they were predicted at their death and were guaranteed negatives. Measured on this task: M020 on
      # mimic-iv, v2: Death exclusion removes 1,931 patients (5.7%); positives unchanged (1,212); AUROC 0.750 -> 0.727
      # [0.67-0.78]; BUN, creatinine, troponin T. 3-year horizon censored at ~1 year in MIMIC-IV.
      death: (None, 0)
  blackout:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      acute_myocardial_infarction_i21: (None, 0)
      death: (None, 0)
  target:
    start: blackout.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: acute_myocardial_infarction_i21
