metadata:
  description:
    "Hospital discharge in hours 24 to 48 of an admission, predicted at hour 24. It is the complement of 'still
    hospitalized at hour 48'. Admissions that end in the first 24 hours are excluded. Source literature: Lee et al. (2026).
    Representation Before Training: A Practical Benchmark for Generative Medical Event Model Tokenization."
  links:
    - https://arxiv.org/html/2604.16775v3#A1.T1
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - AUMCdb
    - CDSL
    - HIRID
    - INSPIRE
    - MC-MED
    - MIMIC-IV
    - NWICU
    - PICdb
    - SICdb
    - Zigong
    - eICU
predicates:
  hospital_admission: ???
  hospital_discharge: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: hospital_admission
windows:
  input:
    start: null
    end: trigger + 24h
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
  in_stay:
    start: trigger
    end: start + 24h
    start_inclusive: false
    end_inclusive: true
    has:
      hospital_discharge: (None, 0)
      death: (None, 0)
  target:
    start: in_stay.end
    end: start + 24h
    start_inclusive: false
    end_inclusive: true
    label: hospital_discharge
