metadata:
  description:
    "Hospital discharge within 7 days of the prediction time, which is 48 hours after admission. Admissions that
    end in the first 48 hours are excluded. A patient who dies in the window is a negative unless the dataset records a discharge
    event at death. Source literature: Pollet and McDermott (2026). Rethinking How We Evaluate Methodological Progress in
    Health AI."
  links:
    - https://arxiv.org/html/2609.18134v2#A4.T6
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - AUMCdb
    - CDSL
    - HIRID
    - INSPIRE
    - MC-MED
    - MIMIC-IV
    - NWICU
    - PICdb
    - SICdb
    - Zigong
    - eICU
predicates:
  hospital_admission: ???
  hospital_discharge: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: hospital_admission
windows:
  input:
    start: null
    end: trigger + 48h
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
  in_stay:
    start: trigger
    end: start + 48h
    start_inclusive: false
    end_inclusive: true
    has:
      hospital_discharge: (None, 0)
      death: (None, 0)
  target:
    start: in_stay.end
    end: start + 7d
    start_inclusive: false
    end_inclusive: true
    label: hospital_discharge
