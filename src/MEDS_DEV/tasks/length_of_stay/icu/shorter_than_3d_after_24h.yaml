metadata:
  description:
    "ICU length of stay below 3 days, predicted 24 hours after ICU admission. The label is an ICU discharge between
    hour 24 and hour 72. It is the complement of the common 'ICU length of stay of 3 days or more' task; flip the label
    for the long stay. Stays that end in the first 24 hours are excluded. Source literature: McDermott et al. (2021). A comprehensive
    EHR timeseries pre-training benchmark. Wang et al. (2020). MIMIC-Extract: A Data Extraction, Preprocessing, and Representation
    Pipeline for MIMIC-III."
  links:
    - https://github.com/mmcdermott/comprehensive_MTL_EHR/blob/95bf1f6cea37299f6275df3a9066e19031173b3e/latent_patient_trajectories/representation_learner/extractors.py#L466-L503
    - https://github.com/MLforHealth/MIMIC_Extract/blob/master/notebooks/Baselines%20for%20Mortality%20and%20LOS%20prediction%20-%20Sklearn.ipynb
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - AUMCdb
    - CDSL
    - HIRID
    - INSPIRE
    - MIMIC-IV
    - NWICU
    - PICdb
    - SICdb
    - Zigong
    - eICU
predicates:
  icu_admission: ???
  icu_discharge: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: icu_admission
windows:
  input:
    start: null
    end: trigger + 24h
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
  in_stay:
    start: trigger
    end: start + 24h
    start_inclusive: false
    end_inclusive: true
    has:
      icu_discharge: (None, 0)
      death: (None, 0)
  target:
    start: in_stay.end
    end: start + 2d
    start_inclusive: false
    end_inclusive: true
    label: icu_discharge
