metadata:
  description:
    "Whether septicemia was diagnosed during the hospital stay that just ended. The label lies before the prediction
    time (the discharge), so the diagnosis codes of the stay must be removed from the model's inputs. Source literature:
    Harutyunyan et al. (2019). Multitask learning and benchmarking with clinical time series data. Sheikhalishahi et al. (2020).
    Benchmarking machine learning models on multi-centre eICU critical care dataset."
  links:
    - https://github.com/YerevaNN/mimic3-benchmarks/blob/master/mimic3benchmark/resources/hcup_ccs_2015_definitions.yaml
    - https://github.com/mostafaalishahi/eICU_Benchmark/blob/82dcd1e511c616a18a2f97f71dec84939c5a6abf/data_extraction/data_extraction_phenotyping.py#L11-L64
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - INSPIRE
    - MC-MED
    - MIMIC-IV
    - NWICU
    - eICU
predicates:
  hospital_admission: ???
  hospital_discharge: ???
  septicemia: ???
trigger: hospital_discharge
windows:
  episode:
    start: end <- hospital_admission
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    label: septicemia
