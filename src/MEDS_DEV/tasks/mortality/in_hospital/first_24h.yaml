metadata:
  description:
    "In-hospital mortality, predicted 24 hours after hospital admission from all data up to then. The label is
    death before the hospital discharge that ends this admission. Admissions that end, by discharge or death, within the first
    24 hours are excluded. Source literature: Burkhart et al. (2026). Federated generative event models for tokenized electronic
    health records. Rajkomar et al. (2018). Scalable and accurate deep learning with electronic health records."
  links:
    - https://github.com/bbj-lab/coreopsis/blob/950c24782670103d130328822d06b39cb4724d7a/src/coreopsis/config/collation.yaml#L244-L247
    - https://www.nature.com/articles/s41746-018-0029-1#Sec13
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - AUMCdb
    - CDSL
    - HIRID
    - INSPIRE
    - MC-MED
    - MIMIC-IV
    - NWICU
    - PICdb
    - SICdb
    - Zigong
    - eICU
predicates:
  hospital_admission: ???
  hospital_discharge: ???
  death:
    code:
      regex: MEDS_DEATH.*
  discharge_or_death:
    expr: or(hospital_discharge, death)
trigger: hospital_admission
windows:
  input:
    start: null
    end: trigger + 24h
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
  in_stay:
    start: trigger
    end: start + 24h
    start_inclusive: false
    end_inclusive: true
    has:
      hospital_discharge: (None, 0)
      death: (None, 0)
  target:
    start: in_stay.end
    end: start -> discharge_or_death
    start_inclusive: false
    end_inclusive: true
    label: death
