metadata:
  description:
    "Ischemic stroke (ICD-10 I63) within 1 year of a hospital discharge, for patients whose record starts at least
    2 years before the discharge. Earlier diagnoses do not exclude a patient. A record that ends before the target window
    is over is labelled negative. Source literature: Jeanselme et al. (2025). FoMoH: A clinically meaningful foundation model
    evaluation for structured electronic health records.
    Discharges by death are excluded."
  links:
    - https://arxiv.org/html/2505.16941v4#A2.SS7
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - INSPIRE
    - MC-MED
    - MIMIC-IV
predicates:
  hospital_discharge: ???
  ischemic_stroke: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: hospital_discharge
windows:
  history:
    start: null
    end: trigger - 730d
    start_inclusive: true
    end_inclusive: true
    has:
      _ANY_EVENT: (1, None)
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      # Audit 2026-11: discharges by death were kept and predicted at the death (guaranteed negatives). Measured: M112
      # on mimic-iv, v2: Death exclusion removes 3,553 discharges by death; positives unchanged (2,110); AUROC 0.688
      # -> 0.696 [0.67-0.72]; age, BUN, troponin. Recurrent strokes count by design.
      death: (None, 0)
  target:
    start: trigger
    end: start + 365d
    start_inclusive: false
    end_inclusive: true
    label: ischemic_stroke
