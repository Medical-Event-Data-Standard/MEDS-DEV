metadata:
  description:
    "First diagnosis of sensorineural hearing loss (ICD-10 H90.3, H90.4, H90.5, H90.6, H90.7, H90.8, H90.A2, H90.A3)
    within 1095 days of a hospital discharge, predicted at discharge. Patients with the outcome before the discharge or in
    the 30 days after it are excluded. The source draws one discharge per patient at random after the first five visits; here
    every discharge is a row. A record that ends before the target window is over is labelled negative. Source literature:
    Zhang et al. (2026). A multimodal and temporal foundation model for virtual patient representations at healthcare system
    scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=56
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - MC-MED
    - NWICU
    - PICdb
    - SICdb
predicates:
  hospital_discharge: ???
  sensorineural_hearing_loss: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: hospital_discharge
windows:
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      sensorineural_hearing_loss: (None, 0)
      death: (None, 0)
  gap:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      sensorineural_hearing_loss: (None, 0)
  target:
    start: gap.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: sensorineural_hearing_loss
