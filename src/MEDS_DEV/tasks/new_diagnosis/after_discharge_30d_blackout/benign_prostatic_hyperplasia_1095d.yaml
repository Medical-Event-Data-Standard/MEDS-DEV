metadata:
  description:
    "First diagnosis of benign prostatic hyperplasia (ICD-10 N40) within 1095 days of a hospital discharge, predicted
    at discharge. Patients with the outcome before the discharge or in the 30 days after it are excluded. The source draws
    one discharge per patient at random after the first five visits; here every discharge is a row. A record that ends before
    the target window is over is labelled negative. Source literature: Zhang et al. (2026). A multimodal and temporal foundation
    model for virtual patient representations at healthcare system scale.
    Only male patients are included."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=56
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - INSPIRE
    - MC-MED
    - MIMIC-IV
    - NWICU
predicates:
  hospital_discharge: ???
  benign_prostatic_hyperplasia: ???
  death:
    code:
      regex: MEDS_DEATH.*
# Audit 2026-11: the outcome is sex-specific but the cohort included both sexes, so sex was the top feature: on benign
# prostatic hyperplasia, restricting to men lowered AUROC by 0.12-0.19 (MIMIC-IV 0.906 -> 0.791, NWICU 0.885 -> 0.699,
# INSPIRE 0.918 -> 0.778). ACES applies every patient_demographics entry, so sex cannot be a dataset predicate (a
# dataset defining both would empty every cohort): this literal pattern covers the sex codes of ALOTT, INSPIRE, MC-
# MED, MIMIC-IV, NWICU and SICdb, all checked to be untimed (static) codes.
patient_demographics:
  male:
    code: { regex: "^(GENDER|SEX)//(M|MALE|Male|male)$" }
trigger: hospital_discharge
windows:
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      benign_prostatic_hyperplasia: (None, 0)
      death: (None, 0)
  gap:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      benign_prostatic_hyperplasia: (None, 0)
  target:
    start: gap.end
    end: start + 1065d
    start_inclusive: false
    end_inclusive: true
    label: benign_prostatic_hyperplasia
