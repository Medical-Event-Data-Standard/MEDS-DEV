metadata:
  description:
    "First diagnosis of aortic stenosis (ICD-10 I06.0, I06.2, I35.0, I35.2, Q23.0, Q25.3) within 1825 days of a
    hospital discharge, predicted at discharge. Patients with the outcome before the discharge or in the 30 days after it
    are excluded. The source draws one discharge per patient at random after the first five visits; here every discharge is
    a row. A record that ends before the target window is over is labelled negative. Source literature: Zhang et al. (2026).
    A multimodal and temporal foundation model for virtual patient representations at healthcare system scale."
  links:
    - https://arxiv.org/pdf/2604.18570v2#page=56
  contacts:
    - name: Robin van de Water
      github_username: rvandewater
  supported_datasets:
    - ALOTT
    - MC-MED
    - MIMIC-IV
    - NWICU
    - SICdb
predicates:
  hospital_discharge: ???
  aortic_stenosis: ???
  death:
    code:
      regex: MEDS_DEATH.*
trigger: hospital_discharge
windows:
  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    index_timestamp: end
    has:
      aortic_stenosis: (None, 0)
      death: (None, 0)
  gap:
    start: trigger
    end: start + 30d
    start_inclusive: false
    end_inclusive: true
    has:
      aortic_stenosis: (None, 0)
  target:
    start: gap.end
    end: start + 1795d
    start_inclusive: false
    end_inclusive: true
    label: aortic_stenosis
