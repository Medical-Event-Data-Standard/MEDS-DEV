defaults:
  - _self_

model: ???
dataset_dir: ???
dataset_name: null # required: steps are stored under output_dir/dataset_name
output_dir: ???

# Which steps to run: `steps` by name, or else the steps selected by `dataset_type` and `mode`. Either way,
# every step they need is added, and finished steps are skipped.
steps: null # e.g. steps=[pretrain]
dataset_type: full # unsupervised (dataset-scoped steps) | supervised (task-scoped steps) | full
mode: full # train (every step but the predict step) | predict (the predict step) | full

# The task(s), needed whenever task-scoped steps run: either one task ...
task_name: null
labels_dir: null
task_criteria_path: null # optional ACES task criteria file; defaults to the registered file of task_name
# ... or several, with shared dataset-scoped steps run once. Labels are read from labels_root/<task>.
tasks: null
labels_root: null

split: null # the split the predict step predicts; defaults to held_out

predicates_path: null # optional path to a predicates file, for models that need one (e.g., for featurization)

model_initialization_dir: null # output_dir of an earlier run whose shared (dataset-scoped) steps to reuse
step_dirs: {} # existing outputs to use for these steps instead of running them, e.g. +step_dirs.pretrain=/path
overwrite: null # none | task | all; which step directories to clear first (defaults to all if do_overwrite)
do_overwrite: false # same as overwrite=all
lock_timeout: 86400 # seconds to wait for another run that holds the lock of a shared step

venv_dir: ${output_dir}/.venv
temp_dir: null

demo: false

hydra:
  job:
    name: "meds_dev_model_${now:%Y-%m-%d_%H-%M-%S}"
  run:
    dir: "${output_dir}/.logs"
  help:
    app_name: "MEDS-DEV Model Running Helper"

    template: |-
      == ${hydra.help.app_name} ==
      ${hydra.help.app_name} is a command line tool for running MEDS-DEV compliant models.

      This tool is primarily designed to help model developers ensure that other users can trivially train
      their models over local health datasets and local data owners trivially train and evaluate MEDS-DEV
      models over their data.

      A model is a list of steps, defined in its model.yaml. Each step is either:
        - dataset-scoped: task-independent (e.g., preprocessing or pre-training). It receives no labels, runs
          once per dataset and is shared by every task. It is stored under
          "<output_dir>/<dataset_name>/_shared/<step>/".
        - task-scoped: run once per task (e.g., fine-tuning, and prediction, including zero-shot prediction).
          It receives the task's labels_dir. It is stored under
          "<output_dir>/<dataset_name>/<task_name>/<step>/".
      Exactly one task-scoped step is the predict step. Its predictions for the held-out split are stored
      under "<output_dir>/<dataset_name>/<task_name>/predict/" (or ".../predict.<split>/" for another split),
      which is the directory to pass to "meds-dev-evaluation" as predictions_dir.

      By default, every step is run, in order, and each step reads the outputs of the earlier steps it needs.
      "output_dir" is an experiment directory that can be shared by many runs: a step that already finished
      there is not run again, so running a second task with the same output_dir reuses the dataset-scoped
      steps. Shared steps are locked while they run, so tasks can also run concurrently. "dataset_name" is
      required, and "task_name" with "labels_dir" (or "tasks" with "labels_root") whenever task-scoped steps
      run.

      To run only part of a model, select steps with either:
        - "steps": a list of step names; or
        - "dataset_type" and "mode": dataset_type=unsupervised selects the dataset-scoped steps,
          dataset_type=supervised the task-scoped ones and dataset_type=full both; mode=train selects every
          step but the predict step, mode=predict the predict step and mode=full all of them.
      The steps that the selected steps need are run too (unless they already finished).

      "tasks" with "labels_root" runs several tasks in one call; the labels of each task are read from
      "<labels_root>/<task>". "step_dirs" gives existing output directories to use for some steps instead of
      running them. "model_initialization_dir" points at the output_dir of an earlier run whose dataset-scoped
      steps should be reused.

      If a model's steps use the "{predicates_path}" template variable (e.g., to bind dataset-specific
      predicates for featurization), point "predicates_path" to the appropriate predicates file (such as the
      dataset's predicates.yaml). It can be left as null for models that do not use it.

      If a model's steps use the "{task_criteria_path}" template variable (e.g., zero-shot models, which
      predict a task from its definition rather than from its labels), it is the ACES criteria file of the
      task: "task_criteria_path" when set, otherwise the registered criteria file of the task. Pair it with
      "predicates_path" to give the model the same task that "meds-dev-task" extracted the labels with.

      "overwrite" chooses which step directories are cleared before the steps run: "none" (the default),
      "task" (this run's task-scoped steps; shared dataset-scoped steps are kept) or "all" (every step this
      run executes). "do_overwrite=true" means "overwrite=all". Nothing else in output_dir is deleted.
