defaults:
  - _self_

dataset_type: supervised
dataset_dir: ???
labels_dir: null
dataset_name: null
task_name: null

venv_dir: ${output_dir}/.venv
temp_dir: null

demo: false
mode: prediction
model: ???
do_overwrite: false

split: null # this is only used for training.

model_initialization_dir: null

predicates_path: null # optional path to a predicates file, for models that need one (e.g., for featurization)

task_criteria_path: null # optional ACES task criteria file; defaults to the registered file of task_name

# The following options apply to models whose model.yaml uses `schema_version: 2` (explicit steps).
steps: null # run only these steps (plus the steps they need); defaults to the steps selected by dataset_type/mode
tasks: null # run several tasks; shared dataset-scoped steps run once. Labels are read from labels_root/<task>
labels_root: null # root directory of the per-task labels, used with tasks
step_dirs: {} # existing outputs to use for these steps instead of running them, e.g. +step_dirs.pretrain=/path
overwrite: null # none | task | all; which step directories to clear first (defaults to all if do_overwrite)
lock_timeout: 86400 # seconds to wait for another run that holds the lock of a shared step

output_dir: ???

hydra:
  job:
    name: "meds_dev_model_${now:%Y-%m-%d_%H-%M-%S}"
  run:
    dir: "${output_dir}/.logs"
  help:
    app_name: "MEDS-DEV Model Running Helper"

    template: |-
      == ${hydra.help.app_name} ==
      ${hydra.help.app_name} is a command line tool for running MEDS-DEV compliant models.

      This tool is primarily designed to help model developers ensure that other users can trivially train
      their models over local health datasets and local data owners trivially train and evaluate MEDS-DEV
      models over their data.

      Models can either be run over either (a) unsupervised data or (b) supervised data, and can be run in any
      of (1) hyperparameter tuning, (2) training, or (3) prediction modes. Various models need not define all
      of the combinations of these modes, and this is by design!

      The assumed (global) flow is:
        1. unsupervised, train   (task-independent, e.g., pre-training; run once per dataset)
        2. unsupervised, predict (optional, task-independent inference)
        3. supervised, train     (task-specific training; null for zero-shot models)
        4. supervised, predict   (prediction for the task, including zero-shot prediction)

      An "unsupervised" stage does not depend on the task and receives no labels_dir, so its output can be
      reused across tasks. A "supervised" stage is run for one task and receives that task's labels_dir.

      In each of these steps the "model_initialization_dir" parameter is assumed to point to the directory
      specified by the "output_dir" of the prior stage, if such a prior stage is necessary and was run.

      It is fully acceptable to have no prior stages having been run, and keep model_initialization_dir as
      null. These parameters are merely used as inputs to the customized model run scripts in the model.yaml
      files. The only mandatory stage for participating in MEDS-DEV is supervised, prediction.

      You can also run in mode=`full` to run all 4 applicable steps in order (with applicability determined by
      what commands are present in the model), with the model_initialization_dir appropriately set in between.
      In this case, `output_dir` should be set to a global "experiment directory" for the series of runs, and
      appropriate sub-dirs will be created and used for the sequence. In this case, if prior stage completion
      is flagged (e.g., if you use the same dir twice), the stage will not be re-run. The directory structure
      used for these will depend on dataset_name and task_name, so those must be set if this mode is used.
      Unsupervised stages are stored under "<output_dir>/<dataset_name>/unsupervised/" and supervised ones
      under "<output_dir>/<dataset_name>/<task_name>/", so running several tasks with the same output_dir
      pre-trains only once.

      If a model's commands use the "{predicates_path}" template variable (e.g., to bind dataset-specific
      predicates for featurization), point "predicates_path" to the appropriate predicates file (such as the
      dataset's predicates.yaml). It can be left as null for models that do not use it.

      If a model's commands use the "{task_criteria_path}" template variable (e.g., zero-shot models, which
      predict a task from its definition rather than from its labels), it is the ACES criteria file of the
      task: "task_criteria_path" when set, otherwise the registered criteria file of "task_name". Pair it
      with "predicates_path" to give the model the same task that "meds-dev-task" extracted the labels with.

      Models whose model.yaml sets "schema_version: 2" list explicit steps instead of the four slots above.
      Each step is dataset-scoped (run once per dataset, stored under
      "<output_dir>/<dataset_name>/_shared/<step>/" and shared by every task) or task-scoped (stored under
      "<output_dir>/<dataset_name>/<task_name>/<step>/"; the predict step under ".../predict/"). For these
      models: dataset_type/mode select steps as above (dataset-scoped steps for "unsupervised", task-scoped
      ones for "supervised"), plus every step they need; "steps" selects steps by name instead; "tasks" with
      "labels_root" runs several tasks in one call; "step_dirs" reuses existing outputs; "overwrite" chooses
      which step directories to clear ("task" keeps shared steps); and "model_initialization_dir" points at
      the output_dir of an earlier run whose shared steps should be reused. dataset_name is required, and
      task_name (or tasks) whenever task-scoped steps run. Shared steps are locked while they run, so tasks
      can run concurrently on the same output_dir.

      If do_overwrite is set to true, the output dir (except for its ".logs" log directory) will be cleared
      before anything is run. With a shared output_dir in full mode, this also deletes the shared pre-training
      stage and other tasks' results. (For version 2 models, do_overwrite means overwrite=all: it clears the
      directories of the steps that run, not the rest of the output dir.)
